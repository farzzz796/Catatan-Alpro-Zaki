<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Website</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-white shadow">
        <div class="container mx-auto px-4 py-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Your Website</h1>
            <nav>
                <a href="#section1" class="nav-link text-gray-600 hover:text-blue-600 mx-4">Section 1</a>
                <a href="#section2" class="nav-link text-gray-600 hover:text-blue-600 mx-4">Section 2</a>
                <a href="#section3" class="nav-link text-gray-600 hover:text-blue-600 mx-4">Section 3</a>
            </nav>
        </div>
    </header>
    <main>
        <section id="section1" class="bg-gray-100 py-20 text-center">
            <h2 class="text-4xl font-bold">Section 1</h2>
            <p class="mt-4 text-gray-600">This is the first section of the webpage.</p>
        </section>
        <section id="section2" class="bg-blue-500 text-white py-20 text-center">
            <h2 class="text-4xl font-bold">Section 2</h2>
            <p class="mt-4">This is the second section with a blue background.</p>
        </section>
        <section id="section3" class="bg-white py-20 text-center">
            <h2 class="text-4xl font-bold text-gray-800">Section 3</h2>
            <p class="mt-4 text-gray-600">This is the third and final section.</p>
        </section>
    </main>
    <footer class="bg-gray-800 text-white text-center py-4">
        <p>&copy; 2025 Your Website. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
